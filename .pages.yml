settings:
  cache: true
media:
  input: media/uploads
  output: /media/uploads
content:
  - name: posts
    label: نوشته‌ها
    type: file
    path: content/journal.json
    format: json
    fields:
      - name: posts
        label: نوشته‌ها
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: id
            type: uuid
            hidden: true
          - name: slug
            type: string
            hidden: true
          - name: title
            label: عنوان فارسی
            type: string
            required: true
          - name: date
            label: تاریخ نوشته
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: body
            label: متن فارسی
            type: rich-text
            required: true
          - name: cover
            label: تصویر جلد (اختیاری)
            type: image
            description: عکس جلد را انتخاب یا بارگذاری کنید. اگر خالی باشد، اولین عکس بارگذاری‌شده در متن برای فهرست بلاگ استفاده می‌شود.
            options:
              extensions: [jpg, jpeg, png, webp, avif]
              rename: safe
          - name: categories
            label: دسته‌بندی
            type: string
            list: true
            default: [life]
          - name: tags
            label: برچسب‌ها
            type: string
            list: true
          - name: englishTitle
            label: عنوان انگلیسی (اختیاری)
            description: برای نسخهٔ انگلیسی، عنوان و متن انگلیسی را هر دو وارد کنید.
            type: string
          - name: englishBody
            label: متن انگلیسی (اختیاری)
            description: متن انگلیسی را اینجا بنویسید یا بچسبانید. در صورت خالی بودن، متن فارسی نمایش داده می‌شود.
            type: rich-text
